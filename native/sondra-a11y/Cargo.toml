[package]
name = "sondra-a11y"
description = "Accessibility for GPUI: an element wrapper, a per-frame accessibility tree, and the bridge to Windows UI Automation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui = "=0.2.2"
accesskit = "0.25"
async-channel = "2"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
accesskit_windows = "0.35"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
