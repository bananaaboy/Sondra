[package]
name = "sondra-drive"
description = "Google Drive for the background service: sign-in, a read-only client, and the Merkliste as a source."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sondra-core = { path = "../sondra-core" }
sondra-daemon = { path = "../sondra-daemon" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The system's certificate store, so that a school or company proxy works the way
# the rest of the computer does; certificates are always checked.
ureq = { version = "3", features = ["platform-verifier", "json"] }
tiny_http = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }
