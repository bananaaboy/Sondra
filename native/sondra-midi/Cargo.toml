[package]
name = "sondra-midi"
description = "USB MIDI keyboards and drum pads: notes in, as the pads of the Zerschneiden page take them."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The program is a Windows program: the inputs are read through the system's own MIDI (winmm). A MIDI library
# for every system would have to be resolved against the sound library the program already links on Linux,
# and the two do not agree.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media", "Win32_Media_Audio"] }
