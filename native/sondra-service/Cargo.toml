[package]
name = "sondra-service"
description = "The background service: the pieces that talk to the sites, and (later) the program that runs rounds."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sondra-core = { path = "../sondra-core" }
sondra-daemon = { path = "../sondra-daemon" }
sondra-extract = { path = "../sondra-extract" }
sondra-download = { path = "../sondra-download" }
url = "2"
tempfile = "3"
# The Recycle Bin on Windows (and the trash of other desktops, for development).
trash = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Networking_Connectivity",
] }

[dev-dependencies]
tiny_http = "0.12"
serde_json.workspace = true
sondra-extract = { path = "../sondra-extract", features = ["testing"] }
