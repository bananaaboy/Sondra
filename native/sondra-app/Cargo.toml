[package]
name = "sondra-app"
description = "Sondra's window: the header, the row of tabs and the screens, built from sondra-ui."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sondra"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
sondra-a11y = { path = "../sondra-a11y" }
sondra-ui = { path = "../sondra-ui" }
sondra-merk = { path = "../sondra-merk" }
sondra-media = { path = "../sondra-media" }
sondra-player = { path = "../sondra-player" }
sondra-playback = { path = "../sondra-playback" }
sondra-audio = { path = "../sondra-audio" }
sondra-speech = { path = "../sondra-speech" }
sondra-mirror = { path = "../sondra-mirror" }
sha2 = "0.10"
sondra-extract = { path = "../sondra-extract" }
sondra-download = { path = "../sondra-download" }
sondra-discord = { path = "../sondra-discord" }
sondra-devices = { path = "../sondra-devices" }
sondra-drive = { path = "../sondra-drive" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
ureq = { version = "3", features = ["platform-verifier"] }
base64 = "0.22"
qrcode = { version = "0.14", default-features = false }
url = "2"
smallvec = "1"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
sondra-extract = { path = "../sondra-extract", features = ["testing"] }
tiny_http = "0.12"
tempfile = "3"
gpui = { version = "=0.2.2", features = ["test-support"] }
accesskit = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

# The stand-in for yt-dlp that the page tests run (the source is sondra-download's); not part of the app.
[[bin]]
name = "fake-ytdlp"
path = "../sondra-download/tests/support/fake_ytdlp.rs"
test = false

# The program's icon, put into the .exe on Windows (`sondra.rc`).
[build-dependencies]
embed-resource = "3"
