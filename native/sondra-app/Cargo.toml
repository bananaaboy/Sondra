[package]
name = "sondra-app"
description = "Sondra's window: the header, the row of tabs and the screens, built from sondra-ui."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sondra"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
sondra-a11y = { path = "../sondra-a11y" }
sondra-ui = { path = "../sondra-ui" }
sondra-merk = { path = "../sondra-merk" }
sondra-media = { path = "../sondra-media" }
sondra-player = { path = "../sondra-player" }
sondra-playback = { path = "../sondra-playback" }
sondra-extract = { path = "../sondra-extract" }
sondra-download = { path = "../sondra-download" }
image = { version = "0.25", default-features = false }
url = "2"
smallvec = "1"
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
sondra-extract = { path = "../sondra-extract", features = ["testing"] }
tiny_http = "0.12"
tempfile = "3"
gpui = { version = "=0.2.2", features = ["test-support"] }
accesskit = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
