[package]
name = "sondra-devices"
description = "Who a device is, in a way no other device can claim: ids from keys, signed records and messages (the web app's deviceIdentity.ts)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
p256 = { version = "0.13", features = ["ecdsa", "jwk", "std"] }
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = "0.2"
sondra-drive = { path = "../sondra-drive" }
# The data channel between two devices: WebRTC, DTLS and SCTP, the same the browsers speak.
webrtc = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
bytes = "1"
url = "2"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
