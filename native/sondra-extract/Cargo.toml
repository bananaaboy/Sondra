[package]
name = "sondra-extract"
description = "Finding the stream behind a link: the series sites and their hosters. A port of api/extractors.js."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex = "1"
base64 = "0.22"
aes-gcm = "0.10"
getrandom = "0.3"
url = "2"
# Certificates are always checked; the system's store is used so that a school or
# company network that inspects HTTPS works the way the rest of the computer does.
ureq = { version = "3", features = ["platform-verifier"] }
# „Netzwerk“ in „Herunterladen“: a connection from the address of a chosen adapter, and the list of them.
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.13"

[features]
# Stand-in sites (`testing::Pages`) for the tests of crates that build on this one.
testing = []

[dev-dependencies]
sondra-extract = { path = ".", features = ["testing"] }
