[package]
name = "sondra-download"
description = "Fetching a resolved stream to a file: direct files and HLS, with a bandwidth limit, resuming, and no memory for the whole film."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sondra-extract = { path = "../sondra-extract" }
sondra-daemon = { path = "../sondra-daemon" }
thiserror.workspace = true
ureq = { version = "3", features = ["platform-verifier"] }
url = "2"
sha2 = "0.10"
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tiny_http = "0.12"

# A stand-in for yt-dlp that the tests run; it is not part of the app.
[[bin]]
name = "fake-ytdlp"
path = "tests/support/fake_ytdlp.rs"
test = false
