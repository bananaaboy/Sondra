[workspace]
resolver = "2"
members = ["sondra-core", "sondra-daemon", "sondra-a11y", "sondra-drive", "sondra-extract", "sondra-download", "sondra-service", "sondra-media", "sondra-ui", "sondra-app", "sondra-merk", "sondra-player", "sondra-audio"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# GPUI pulls in `xattr`, which does not build on Linux with the current `libc`.
# See vendor/xattr/PATCH.md.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

# The test builds of the UI crates are large; debug symbols for dependencies are never read.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false
