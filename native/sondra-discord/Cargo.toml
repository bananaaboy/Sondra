[package]
name = "sondra-discord"
description = "Discord Rich Presence over Discord's local pipe (desktop/discord.mjs): what is being watched, as a status, only while the person wants it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Pipes"] }
