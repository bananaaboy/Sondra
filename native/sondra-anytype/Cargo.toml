[package]
name = "sondra-anytype"
description = "The Merkliste in Anytype: one page in a space the person picks, read and written through Anytype's local API — both dialects, the page as Markdown, and the round that keeps it in step with the list."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sondra-merk = { path = "../sondra-merk" }
sondra-drive = { path = "../sondra-drive" }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
url = "2"
# Anytype answers on this computer only (127.0.0.1); no certificate is involved, and none is ever skipped.
ureq = { version = "3", features = ["json"] }
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
