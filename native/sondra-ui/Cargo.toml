[package]
name = "sondra-ui"
description = "Sondra's look for GPUI: the palette (light and dark), type, radii and the components, every one of them readable to a screen reader."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui = "=0.2.2"
sondra-a11y = { path = "../sondra-a11y" }

[dev-dependencies]
accesskit = "0.25"
gpui = { version = "=0.2.2", features = ["test-support"] }
