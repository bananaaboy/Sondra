[package]
name = "sondra-ui"
description = "Sondra's look for GPUI: the palette (light and dark), type, radii and the components, every one of them readable to a screen reader."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui = "=0.2.2"
sondra-a11y = { path = "../sondra-a11y" }
unicode-segmentation = "1"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false }
smallvec = "1"
accesskit = "0.25"
gpui = { version = "=0.2.2", features = ["test-support"] }
