# Builds the Android app (android/): an app of its own around the website —
# its own WebView, no browser bar, and the website's Google sign-in for Drive
# opened in the browser (nothing of Google's is built into the app).
#
# Every run builds the APK (to install directly) and the AAB (for Google
# Play), checks them, starts the APK on an Android 14 emulator
# (android/launch-check.sh, pictures as the artifact "Sondra-Android-Bilder"),
# and keeps both as the artifact "Sondra-Android".
#
# The key: from the secrets ANDROID_KEYSTORE_BASE64 and
# ANDROID_KEYSTORE_PASSWORD. Without them the debug key signs — the app
# installs and runs, but a later build cannot update it, and no release is
# made with it. The key is made once on a computer of one's own (README,
# „Android-Schlüssel“), never in a run: the artifacts of this public
# repository can be downloaded by anyone with a GitHub account.
#
# The official release (Desktop workflow, „release“ or a tag) calls this
# workflow and publishes the APK together with the setups. A manual run
# with "release" ticked attaches the APK to the GitHub release v<version
# from package.json> on its own, as Sondra-Android-<version>.apk and
# Sondra-Android.apk.

name: Android

on:
  push:
    branches: ['**']
    paths:
      - android/**
      - package.json
      - .github/workflows/android.yml
  workflow_dispatch:
    inputs:
      release:
        description: 'APK an das GitHub Release v<Version aus package.json> hängen'
        type: boolean
        default: false
  # The official release builds the app here as well.
  workflow_call:
    outputs:
      version:
        value: ${{ jobs.android.outputs.version }}
      debug:
        description: 'true when the debug key signed: nothing is published then'
        value: ${{ jobs.android.outputs.debug }}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.check.outputs.version }}
      debug: ${{ steps.check.outputs.debug }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/sondra.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$store"
            password="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Kein Signaturschlüssel (ANDROID_KEYSTORE_BASE64): der Debug-Schlüssel signiert. Die App läuft, lässt sich aber später nicht aktualisieren."
            exit 0
          fi
          {
            echo "SONDRA_ANDROID_KEYSTORE=$store"
            echo "SONDRA_ANDROID_KEYSTORE_PASSWORD=$password"
            echo "SONDRA_ANDROID_KEY_ALIAS=sondra"
          } >> "$GITHUB_ENV"

      - name: Build, lint
        working-directory: android
        run: ./gradlew --no-daemon --console=plain lintRelease assembleRelease bundleRelease

      - name: Check the app
        id: check
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=android/app/build/outputs/apk/release/app-release.apk
          version="$(node -p "require('./package.json').version")"
          badging="$("$tools/aapt2" dump badging "$apk")"
          echo "$badging" | grep -q "package: name='ch.lizge.sondra'.*versionName='$version'" || { echo "::error::Paket oder Version stimmt nicht:"; echo "$badging" | head -3; exit 1; }
          echo "$badging" | grep -q "launchable-activity: name='ch.lizge.sondra.MainActivity'" || { echo "::error::Keine Startaktivität"; exit 1; }
          certs="$("$tools/apksigner" verify --print-certs "$apk")"
          colons() { tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'; }
          digest="$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | colons)"
          # Nothing of Google's in the app: the sign-in is the website's.
          if unzip -p "$apk" 'classes*.dex' | grep -ac 'GOCSPX-' > /dev/null; then echo "::error::Ein Google-Secret steckt in der App"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "debug=$(echo "$certs" | grep -q 'CN=Android Debug' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp "$apk" "out/Sondra-Android-$version.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/Sondra-Android-$version.aab"
          {
            echo "### Sondra für Android $version"
            echo
            echo "APK $(du -h "$apk" | cut -f1), signiert mit:"
            echo
            echo '```'
            echo "$certs" | grep -E 'DN:|SHA-256|SHA-1'
            echo '```'
            echo
            echo "Google Drive: die Anmeldung der Website (Client „Webanwendung“ in Vercel), im Browser geöffnet."
            echo
            echo "Für \`ANDROID_CERT_SHA256\` in Vercel (Links auf sondra.lizge.ch öffnen dann ohne Rückfrage in der App):"
            echo
            echo '```'
            echo "$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: Sondra-Android
          path: out/
          if-no-files-found: error

      # The app on Android 14: started from its icon, a shortcut, a link and
      # a share, without a crash. Builds and lint passed while every start
      # crashed (android/launch-check.sh says why); this is what notices.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash android/launch-check.sh out out-bilder

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Sondra-Android-Bilder
          path: out-bilder/
          if-no-files-found: ignore

      - name: Attach to the release
        # Only when run on its own. Called by the Desktop release, `inputs`
        # carried that run's „release“ too, and this step published v1.1.15
        # with nothing but the APK before the setups were there.
        if: inputs.release && github.workflow == 'Android'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          DEBUG_KEY: ${{ steps.check.outputs.debug }}
        run: |
          set -euo pipefail
          if [ "$DEBUG_KEY" = "true" ]; then
            echo "::error::Mit dem Debug-Schlüssel wird nichts veröffentlicht: installierte Apps liessen sich nicht aktualisieren."
            exit 1
          fi
          tag="v$VERSION"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --title "Sondra $VERSION" --notes "Sondra $VERSION."
          cp "out/Sondra-Android-$VERSION.apk" out/Sondra-Android.apk
          gh release upload "$tag" "out/Sondra-Android-$VERSION.apk" out/Sondra-Android.apk --clobber
