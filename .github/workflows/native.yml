# The native client (`native/`): the Rust core is tested on the systems it
# will run on. The fixtures it reads are written by the web app's own
# serializer, so a change to the file format that is not carried over here
# fails this check instead of a user's Drive.

name: Native

on:
  push:
    branches: [main]
    paths: ['native/**', 'scripts/make-native-fixture.mts', 'scripts/make-media-golden.mts', 'src/lib/sqlite.ts', 'src/lib/convert.ts', 'src/lib/convertPresets.ts', 'src/lib/loudness.ts', 'src/lib/fft.ts', 'src/lib/onsets.ts', 'src/lib/tempo.ts', 'src/lib/chroma.ts', 'src/lib/key.ts', 'src/lib/pitch.ts', 'src/lib/midi.ts', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'scripts/make-native-fixture.mts', 'scripts/make-media-golden.mts', 'src/lib/sqlite.ts', 'src/lib/convert.ts', 'src/lib/convertPresets.ts', 'src/lib/loudness.ts', 'src/lib/fft.ts', 'src/lib/onsets.ts', 'src/lib/tempo.ts', 'src/lib/chroma.ts', 'src/lib/key.ts', 'src/lib/pitch.ts', 'src/lib/midi.ts', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run of the same branch pointless; the last state is what counts.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The fixtures are what the web app writes today
        shell: bash
        run: |
          npm run native:fixture
          git diff --exit-code -- native/sondra-core/tests/fixtures
      - name: The converter's commands and the tabs are what the web app builds today
        shell: bash
        run: |
          npm run native:golden
          git diff --exit-code -- native/sondra-media/tests/golden native/sondra-app/tests/golden
      # The tests of the media and download crates run the real FFmpeg (and skip, saying so, without it).
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Libraries GPUI links against on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev libfreetype-dev libwayland-dev
      - uses: actions/cache@v4
        with:
          path: native/target
          key: native-${{ matrix.os }}-${{ hashFiles('native/Cargo.lock') }}
      - run: cargo test --manifest-path native/Cargo.toml --locked

  # The accessibility bridge, asked the way a screen reader asks: through Windows
  # UI Automation, about a real window. Names, roles, places, activation, toggling, focus.
  uia:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: native/target
          key: native-uia-${{ hashFiles('native/Cargo.lock') }}
          # A failed check must not throw away nine minutes of build.
          save-always: true
      - run: cargo build --release --locked --example demo -p sondra-a11y --manifest-path native/Cargo.toml
      - name: Start the demo window and ask it through UI Automation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path run | Out-Null
          $env:RUST_BACKTRACE = '1'
          $exe = (Resolve-Path native/target/release/examples/demo.exe).Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path run).Path -PassThru -RedirectStandardOutput demo-out.txt -RedirectStandardError demo-err.txt
          Start-Sleep -Seconds 4
          if ($p.HasExited) {
            "the demo ended by itself after less than 4 seconds, exit code $($p.ExitCode)" | Tee-Object -FilePath uia.txt
            Get-Content demo-out.txt, demo-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath uia.txt
            exit 1
          }
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File native/sondra-a11y/uia-check.ps1 -ProcessId $p.Id -WorkDir (Resolve-Path run).Path 2>&1
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath uia.txt
          if ($p.HasExited) { "the demo had ended by the end of the check, exit code $($p.ExitCode)" | Tee-Object -Append -FilePath uia.txt }
          Get-Content demo-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath uia.txt
          Get-Content uia.txt | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uia-result
          path: uia.txt

  # The look, photographed: the components in light and dark side by side, on a real Windows desktop.
  gallery:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: native/target
          key: native-ui-${{ hashFiles('native/Cargo.lock') }}
          save-always: true
      - run: cargo build --release --locked --example gallery -p sondra-ui --manifest-path native/Cargo.toml
      - name: Start the gallery and take a screenshot
        shell: pwsh
        run: |
          $exe = (Resolve-Path native/target/release/examples/gallery.exe).Path
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput gallery-out.txt -RedirectStandardError gallery-err.txt
          Start-Sleep -Seconds 4
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Add-Type -Namespace Win -Name Native -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int h2, bool r);'
          $p.Refresh()
          "window: $($p.MainWindowHandle) '$($p.MainWindowTitle)', exited: $($p.HasExited)" | Tee-Object -FilePath gallery.txt
          if ($p.MainWindowHandle -ne 0) {
            [Win.Native]::ShowWindow($p.MainWindowHandle, 9) | Out-Null
            [Win.Native]::MoveWindow($p.MainWindowHandle, 0, 0, 1120, 900, $true) | Out-Null
            [Win.Native]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen: $($b.Width)x$($b.Height)" | Tee-Object -Append -FilePath gallery.txt
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\gallery.png")
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content gallery-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath gallery.txt
          Get-Content gallery.txt >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery
          path: |
            gallery.png
            gallery.txt
