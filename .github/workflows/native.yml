# The native client (`native/`): the Rust core is tested on the systems it
# will run on. The fixtures it reads are written by the web app's own
# serializer, so a change to the file format that is not carried over here
# fails this check instead of a user's Drive.

name: Native

on:
  push:
    branches: [main]
    paths: ['native/**', 'scripts/make-native-fixture.mts', 'scripts/make-media-golden.mts', 'src/lib/sqlite.ts', 'scripts/verify-native-sqlite.mts', 'src/lib/convert.ts', 'src/lib/convertPresets.ts', 'src/lib/loudness.ts', 'src/lib/fft.ts', 'src/lib/onsets.ts', 'src/lib/tempo.ts', 'src/lib/chroma.ts', 'src/lib/key.ts', 'src/lib/pitch.ts', 'src/lib/midi.ts', 'src/lib/introPrint.ts', 'src/lib/actions.ts', 'src/components/panelMeta.tsx', 'scripts/make-nav-golden.mts', 'scripts/make-merk-golden.mts', 'scripts/make-share-golden.mts', 'scripts/make-folder-golden.mts', 'src/lib/folder.ts', 'src/lib/episodeMatch.ts', 'scripts/verify-native-share.mts', 'src/lib/merkShare.ts', 'src/lib/shareCover.ts', 'src/lib/merkliste.ts', 'src/lib/download.ts', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'scripts/make-native-fixture.mts', 'scripts/make-media-golden.mts', 'src/lib/sqlite.ts', 'src/lib/convert.ts', 'src/lib/convertPresets.ts', 'src/lib/loudness.ts', 'src/lib/fft.ts', 'src/lib/onsets.ts', 'src/lib/tempo.ts', 'src/lib/chroma.ts', 'src/lib/key.ts', 'src/lib/pitch.ts', 'src/lib/midi.ts', 'src/lib/introPrint.ts', 'src/lib/actions.ts', 'src/components/panelMeta.tsx', 'scripts/make-nav-golden.mts', 'scripts/make-merk-golden.mts', 'scripts/make-share-golden.mts', 'scripts/make-folder-golden.mts', 'src/lib/folder.ts', 'src/lib/episodeMatch.ts', 'scripts/verify-native-share.mts', 'src/lib/merkShare.ts', 'src/lib/shareCover.ts', 'src/lib/merkliste.ts', 'src/lib/download.ts', '.github/workflows/native.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run of the same branch pointless; the last state is what counts.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The fixtures are what the web app writes today
        shell: bash
        run: |
          npm run native:fixture
          git diff --exit-code -- native/sondra-core/tests/fixtures
      # Only on Linux: the dates in these tables are counted in Europe/Zurich through Node's TZ, which
      # is only certain on Linux; the Rust tests on Windows still read the committed tables.
      - name: The converter's commands and the tabs are what the web app builds today
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm run native:golden
          git diff --exit-code -- native/sondra-media/tests/golden native/sondra-app/tests/golden native/sondra-app/data native/sondra-ui/data native/sondra-merk/tests/golden native/sondra-speech/tests/golden native/sondra-download/tests/golden
      # The tests of the media and download crates run the real FFmpeg (and skip, saying so, without it).
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        # The runner's mirror now and then answers an update without the main archive; ask again.
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends ffmpeg && exit 0
            echo "apt did not have it (try $i)"; sleep 20
          done
          exit 1
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Libraries GPUI links against on Linux
        if: runner.os == 'Linux'
        run: |
          for i in 1 2 3 4 5; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev libfreetype-dev libwayland-dev libasound2-dev && exit 0
            echo "apt did not have it (try $i)"; sleep 20
          done
          exit 1
      - uses: actions/cache@v4
        with:
          path: native/target
          key: native-${{ matrix.os }}-${{ hashFiles('native/Cargo.lock') }}
      # Speech recognition is built from whisper.cpp: bindgen needs libclang, which the Windows runner has
      # but does not announce.
      - name: libclang for whisper.cpp (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      # A real model and a real voice (whisper.cpp's own sample), only on Linux: the test that listens skips,
      # saying so, where they are not.
      - name: A Whisper model and a voice to test with (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/whisper"
          curl -sSL --retry 4 -o "$RUNNER_TEMP/whisper/ggml-base-q5_1.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base-q5_1.bin
          curl -sSL --retry 4 -o "$RUNNER_TEMP/whisper/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav
          ls -l "$RUNNER_TEMP/whisper"
          echo "SONDRA_WHISPER_DIR=$RUNNER_TEMP/whisper" >> "$GITHUB_ENV"
      - run: cargo test --manifest-path native/Cargo.toml --locked
      # What the native client writes, read by the website's own reader: the list in Drive may never get
      # worse because a native client wrote it.
      - name: The website reads the file the native client writes
        shell: bash
        run: |
          npm run verify:native-sqlite
          npm run verify:native-share
          npm run verify:native-devices
      # The data channel against the website's own transfer code in a real Chromium, both directions.
      - name: A browser and the native device send each other 20 MB
        if: runner.os == 'Linux'
        run: |
          npx playwright-core install --with-deps chromium
          cargo build --manifest-path native/Cargo.toml --locked -p sondra-devices --example rtc_peer
          E2E_CHROMIUM="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" npm run verify:native-rtc

  # The accessibility bridge, asked the way a screen reader asks: through Windows
  # UI Automation, about a real window. Names, roles, places, activation, toggling, focus.
  uia:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: native/target
          key: native-uia-${{ hashFiles('native/Cargo.lock') }}
          # A failed check must not throw away nine minutes of build.
          save-always: true
      - run: cargo build --release --locked --example demo -p sondra-a11y --manifest-path native/Cargo.toml
      - name: Start the demo window and ask it through UI Automation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path run | Out-Null
          $env:RUST_BACKTRACE = '1'
          $exe = (Resolve-Path native/target/release/examples/demo.exe).Path
          $p = Start-Process -FilePath $exe -WorkingDirectory (Resolve-Path run).Path -PassThru -RedirectStandardOutput demo-out.txt -RedirectStandardError demo-err.txt
          Start-Sleep -Seconds 4
          if ($p.HasExited) {
            "the demo ended by itself after less than 4 seconds, exit code $($p.ExitCode)" | Tee-Object -FilePath uia.txt
            Get-Content demo-out.txt, demo-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath uia.txt
            exit 1
          }
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File native/sondra-a11y/uia-check.ps1 -ProcessId $p.Id -WorkDir (Resolve-Path run).Path 2>&1
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath uia.txt
          if ($p.HasExited) { "the demo had ended by the end of the check, exit code $($p.ExitCode)" | Tee-Object -Append -FilePath uia.txt }
          Get-Content demo-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath uia.txt
          Get-Content uia.txt | Out-String | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uia-result
          path: uia.txt

  # The look, photographed: the components in light and dark side by side, on a real Windows desktop.
  gallery:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: native/target
          key: native-ui-${{ hashFiles('native/Cargo.lock') }}
          save-always: true
      - run: cargo build --release --locked --example gallery -p sondra-ui --manifest-path native/Cargo.toml
      - name: Start the gallery and take a screenshot
        shell: pwsh
        run: |
          $exe = (Resolve-Path native/target/release/examples/gallery.exe).Path
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput gallery-out.txt -RedirectStandardError gallery-err.txt
          Start-Sleep -Seconds 4
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Add-Type -Namespace Win -Name Native -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int h2, bool r);'
          $p.Refresh()
          "window: $($p.MainWindowHandle) '$($p.MainWindowTitle)', exited: $($p.HasExited)" | Tee-Object -FilePath gallery.txt
          if ($p.MainWindowHandle -ne 0) {
            [Win.Native]::ShowWindow($p.MainWindowHandle, 9) | Out-Null
            [Win.Native]::MoveWindow($p.MainWindowHandle, 0, 0, 1120, 900, $true) | Out-Null
            [Win.Native]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          }
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          "screen: $($b.Width)x$($b.Height)" | Tee-Object -Append -FilePath gallery.txt
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\gallery.png")
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Get-Content gallery-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath gallery.txt
          Get-Content gallery.txt >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery
          path: |
            gallery.png
            gallery.txt

  # The biggest open question: a film in a GPUI window. Each frame decoded by FFmpeg is handed to the window
  # as a picture; this measures what that costs on a real desktop, and photographs it mid-play.
  video:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: choco install ffmpeg --no-progress -y
      - uses: actions/cache@v4
        with:
          path: native/target
          key: native-video-${{ hashFiles('native/Cargo.lock') }}
          save-always: true
      - run: cargo build --release --locked --example videoprobe -p sondra-ui --manifest-path native/Cargo.toml
      - name: Play the test film in the window, measure it, photograph it
        shell: pwsh
        run: |
          $exe = (Resolve-Path native/target/release/examples/videoprobe.exe).Path
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput video-out.txt -RedirectStandardError video-err.txt
          Start-Sleep -Seconds 4
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Add-Type -Namespace Win -Name Native -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int h2, bool r);'
          $p.Refresh()
          if ($p.MainWindowHandle -ne 0) {
            [Win.Native]::ShowWindow($p.MainWindowHandle, 9) | Out-Null
            [Win.Native]::MoveWindow($p.MainWindowHandle, 0, 0, 1280, 760, $true) | Out-Null
            [Win.Native]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          }
          Start-Sleep -Seconds 1
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\video.png")
          [void]$p.WaitForExit(60000)
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force; "the probe did not end by itself" | Tee-Object -FilePath video.txt }
          Copy-Item videoprobe.json video.txt -ErrorAction SilentlyContinue
          Get-Content video-out.txt, video-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath video.txt
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content video.txt >> $env:GITHUB_STEP_SUMMARY
          '```' | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: |
            video.png
            video.txt

  # The app itself, on a real Windows desktop: photographed, and driven through UI Automation the way a
  # screen reader user drives it — a menu, a tool, the search, Escape.
  app:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: native/target
          key: native-app-${{ hashFiles('native/Cargo.lock') }}
          save-always: true
      - run: choco install ffmpeg --no-progress -y
      - run: cargo build --release --locked --bin sondra -p sondra-app --manifest-path native/Cargo.toml
      - name: Start the app, photograph it and drive it through UI Automation
        shell: pwsh
        run: |
          $exe = (Resolve-Path native/target/release/sondra.exe).Path
          # The app starts on an empty data folder of its own: the Merkliste check types a series in.
          $env:SONDRA_DATA = Join-Path $env:RUNNER_TEMP 'sondra-daten'
          New-Item -ItemType Directory -Force -Path $env:SONDRA_DATA | Out-Null
          # A folder of films for the Ordner check, offered to the app as the one of the last time.
          $env:SONDRA_DEMO = Join-Path $env:RUNNER_TEMP 'Anime'
          New-Item -ItemType Directory -Force -Path (Join-Path $env:SONDRA_DEMO 'Frieren\Staffel 1') | Out-Null
          foreach ($f in @('film.mp4', 'poster.png', 'notizen.txt', 'Frieren\Staffel 1\Frieren S01E01.mkv')) {
            [IO.File]::WriteAllBytes((Join-Path $env:SONDRA_DEMO $f), (New-Object byte[] 4096))
          }
          $remembered = @{ 'sondra:ordner:pfad' = $env:SONDRA_DEMO } | ConvertTo-Json
          [IO.File]::WriteAllText((Join-Path $env:SONDRA_DATA 'Ordner.json'), $remembered, (New-Object System.Text.UTF8Encoding($false)))
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Start-Sleep -Seconds 4
          if ($p.HasExited) {
            "the app ended by itself after less than 4 seconds, exit code $($p.ExitCode)" | Tee-Object -FilePath app.txt
            Get-Content app-out.txt, app-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath app.txt
            exit 1
          }
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Add-Type -Namespace Win -Name Native -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n); [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr h, int x, int y, int w, int h2, bool r);'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\$name")
          }
          $p.Refresh()
          [Win.Native]::ShowWindow($p.MainWindowHandle, 9) | Out-Null
          [Win.Native]::MoveWindow($p.MainWindowHandle, 0, 0, 1024, 740, $true) | Out-Null
          [Win.Native]::SetForegroundWindow($p.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 3
          Shot 'app-start.png'
          $out = powershell.exe -NoProfile -ExecutionPolicy Bypass -File native/sondra-app/uia-app.ps1 -ProcessId $p.Id -ShotDir $PWD 2>&1
          $code = $LASTEXITCODE
          $out | Tee-Object -FilePath app.txt
          Shot 'app-menu.png'
          if ($p.HasExited) { "the app had ended by the end of the check, exit code $($p.ExitCode)" | Tee-Object -Append -FilePath app.txt }
          Get-Content app-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath app.txt
          Get-Content app.txt | Select-String -Pattern '^(ok|FAIL|all checks|[0-9]+ check)' | ForEach-Object { $_.Line } | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          # The same program, started with a film on its command line (what „Öffnen mit Sondra“ does): the
          # player opens by itself and the film plays.
          $film = Join-Path $env:RUNNER_TEMP 'film.mp4'
          ffmpeg -v error -y -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440 -t 30 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -shortest $film
          $p2 = Start-Process -FilePath $exe -ArgumentList ('"' + $film + '"') -PassThru -RedirectStandardOutput player-out.txt -RedirectStandardError player-err.txt
          Start-Sleep -Seconds 4
          $p2.Refresh()
          [Win.Native]::ShowWindow($p2.MainWindowHandle, 9) | Out-Null
          [Win.Native]::MoveWindow($p2.MainWindowHandle, 0, 0, 1024, 740, $true) | Out-Null
          [Win.Native]::SetForegroundWindow($p2.MainWindowHandle) | Out-Null
          Start-Sleep -Seconds 2
          $out2 = powershell.exe -NoProfile -ExecutionPolicy Bypass -File native/sondra-app/uia-player.ps1 -ProcessId $p2.Id -ShotDir $PWD 2>&1
          $code2 = $LASTEXITCODE
          $out2 | Tee-Object -FilePath player.txt
          Get-Content player-err.txt -ErrorAction SilentlyContinue | Tee-Object -Append -FilePath player.txt
          '--- the player' | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-Content player.txt | Select-String -Pattern '^(ok|FAIL|all checks|[0-9]+ check)' | ForEach-Object { $_.Line } | Add-Content $env:GITHUB_STEP_SUMMARY
          if (-not $p2.HasExited) { Stop-Process -Id $p2.Id -Force }
          if ($code -eq 0) { $code = $code2 }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app
          path: |
            app-start.png
            app-merkliste.png
            app-ordner.png
            app-menu.png
            app-player.png
            player.txt
            app.txt
