<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sondra — Medienwerkzeuge, die lokal laufen</title>
    <meta
      name="description"
      content="Konvertieren, Spuren trennen, normalisieren und sampeln — vollständig lokal im Browser über WebAssembly und Web Workers. Keine Uploads, kein Server."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2eee4" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="preload" href="./fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/courier-prime-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
  </head>
  <body>
    <script>
      /*
       * Theme, applied before the first paint. Reading the stored choice here
       * rather than in React avoids a flash of the wrong theme on every load.
       * "system" writes nothing and lets the media query in theme.css decide.
       */
      (function () {
        try {
          var choice = localStorage.getItem('sondra:theme')
          if (choice === 'light' || choice === 'dark') {
            document.documentElement.setAttribute('data-theme', choice)
          }
          var dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0a110d' : '#f2eee4')
        } catch (error) {
          /* private window, blocked storage — the media query still applies */
        }
      })()
    </script>
    <script>
      /*
       * The service worker does two jobs: it adds the cross-origin isolation
       * headers on hosts that cannot set them (unlocking SharedArrayBuffer and
       * the multi-threaded FFmpeg core), and it caches the app for offline use.
       *
       * It is registered either way. Hosts that already send the headers still
       * want the offline cache; only the one-time reload that hands control to
       * a fresh worker is skipped when isolation is already in place.
       */
      (function () {
        if (!window.isSecureContext || !('serviceWorker' in navigator)) return
        var alreadyIsolated = window.crossOriginIsolated === true

        /* Hand the worker the hashed bundles this page actually used, so a
           single visit is enough to make the app work offline afterwards. The
           worker cannot know these names on its own. */
        function reportResources(worker) {
          if (!worker) return
          function send() {
            var urls = performance
              .getEntriesByType('resource')
              .map(function (entry) { return entry.name })
              .filter(function (url) { return url.indexOf(location.origin) === 0 })
            urls.push(location.href.split('#')[0])
            worker.postMessage({ type: 'precache', urls: urls })
          }
          /* Registration usually resolves after `load` has already fired, so
             waiting for that event alone would never run. The delay lets fonts
             and other late requests show up in the resource timeline first. */
          var run = function () { setTimeout(send, 1200) }
          if (document.readyState === 'complete') run()
          else window.addEventListener('load', run)
        }

        function whenActive(registration, handler) {
          var worker = registration.installing || registration.waiting || registration.active
          if (!worker) return
          if (worker.state === 'activated') handler(worker)
          else {
            worker.addEventListener('statechange', function () {
              if (worker.state === 'activated') handler(worker)
            })
          }
        }

        navigator.serviceWorker.register('./coi-serviceworker.js', { scope: './' }).then(
          function (registration) {
            /* Without isolation the worker only takes effect from the next load
               onwards, so reload once to get it. */
            if (!alreadyIsolated && registration.active && !navigator.serviceWorker.controller) {
              window.location.reload()
              return
            }
            whenActive(registration, reportResources)
          },
          function (error) {
            console.warn('[sondra] Service Worker nicht verfügbar:', error)
          },
        )
      })()
    </script>
    <div id="root"></div>
    <noscript>
      Sondra verarbeitet alle Medien lokal in Ihrem Browser und benötigt dafür JavaScript.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
